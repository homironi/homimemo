# lychee.toml
# https://lychee.cli.rs/guides/config/

# サイトのルートディレクトリを指定
root_dir = "./_public"

exclude = [
    # og:imageのURLはあるのに404になっているので一時除外
    'https://expressive-code\.com/open-graph/.*\.png',
    # HTTP/2エラーが出るドメイン
    'https://www\.adobe\.com/.*',
    'https://helpx\.adobe\.com/.*',
    'https://www\.autodesk\.com/.*',
    # Googleのfaviconサービス
    'https://www\.google\.com/s2/favicons.*',
    # SamsungのOGP画像（プロトコル相対パス対策）
    '\.*cdn\.samsung\.com/etc/designs/.*',
    # Cloudflareの管理外の画像パス：
    # og:image自体が"/img/cf-social-card.png"になっているので除外する
    '.*/img/cf-social-card\.png'
]

exclude_path = [
    # サイトマップとRSSは自サイトのみ、かつ、存在するリンク（ただし公開直前だと公開URLではまだ存在しないリンク）なので除外
    'rss\.xml',
    '.*sitemap.*'
]

accept = [200, 403, 429]